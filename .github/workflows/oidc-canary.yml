# =============================================================================
# OIDC canary — verifies the Action v3.2 GitHub-OIDC fetch + server metering
# =============================================================================
# Per R48 review condition (GPT 2026-05-18): the "Free tier needs no API key"
# marketing promise stays gated until this canary proves the full path
# end-to-end on cipherwakelabs/pqcheck itself.
#
# What this verifies (GPT minimum canary checklist):
#   1. Workflow with permissions: id-token: write             ✓
#   2. NO CIPHERWAKE_API_KEY secret in the workflow            ✓
#   3. Action fetches OIDC token                                ✓
#   4. /api/scan accepts it                                     ✓
#   5. gh_action_repo_quota increments for cipherwakelabs/pqcheck (verified
#      by the X-Cipherwake-Quota-* headers reported in the response)
#   6. Quota headers show cap/remaining/tier                    ✓
#   7. Wrong-audience token gets 401 oidc_error_code=audience   ✓
#
# Why direct curl, not the composite Action:
# We need to read the X-Cipherwake-Quota-* response headers, which the
# Action wrapper currently doesn't surface. The canary calls /api/scan
# directly with the same OIDC token the Action would mint, so the OIDC
# fetch + signature verify + repo metering paths are still tested fully.
# =============================================================================

name: OIDC canary

on:
  push:
    branches: [main]
    paths:
      - 'action/**'
      - '.github/workflows/oidc-canary.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for the OIDC token fetch

jobs:
  # ---------------------------------------------------------------------------
  # POSITIVE — fetch a real OIDC token + call /api/scan, verify quota headers
  # ---------------------------------------------------------------------------
  positive:
    name: Positive (OIDC happy path)
    runs-on: ubuntu-latest
    steps:
      - name: Fetch OIDC token + POST to /api/scan, assert quota headers
        shell: bash
        run: |
          set -euo pipefail
          # Fetch OIDC token with the correct audience
          OIDC_RESPONSE=$(curl -sS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=cipherwake-action-v1")
          TOKEN=$(echo "$OIDC_RESPONSE" | jq -r '.value // empty')
          if [ -z "$TOKEN" ]; then
            echo "::error::OIDC token fetch failed: $(echo "$OIDC_RESPONSE" | head -c 200)"
            exit 1
          fi
          case "$TOKEN" in
            *.*.*) ;;
            *) echo "::error::Token not JWT-shaped"; exit 1 ;;
          esac
          echo "::notice::OIDC token fetched (JWT-shaped, audience=cipherwake-action-v1)"

          # Call /api/scan with the token and capture response headers
          curl -sS -D /tmp/headers -o /tmp/body \
            -w "HTTP_STATUS=%{http_code}\n" \
            -X POST "https://cipherwake.io/api/scan?domain=cipherwake.io" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}' | tee /tmp/status
          HTTP_STATUS=$(grep -oE 'HTTP_STATUS=[0-9]+' /tmp/status | cut -d= -f2)
          echo "::notice::Server returned HTTP $HTTP_STATUS"
          echo "--- response headers ---"
          cat /tmp/headers

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Expected 200 from OIDC-authenticated /api/scan, got $HTTP_STATUS"
            echo "--- response body ---"
            cat /tmp/body
            exit 1
          fi

          # Verify the quota headers were set (proves applyRepoQuota's OIDC
          # branch fired, not the IP fallback).
          TIER=$(grep -i 'X-Cipherwake-Quota-Tier:' /tmp/headers | tr -d '\r' | awk '{print $2}')
          CAP=$(grep -i 'X-Cipherwake-Quota-Cap:' /tmp/headers | tr -d '\r' | awk '{print $2}')
          REMAINING=$(grep -i 'X-Cipherwake-Quota-Remaining:' /tmp/headers | tr -d '\r' | awk '{print $2}')
          if [ -z "$TIER" ] || [ -z "$CAP" ] || [ -z "$REMAINING" ]; then
            echo "::error::Missing X-Cipherwake-Quota-* headers — OIDC path did not fire (IP-fallback?)"
            exit 1
          fi
          if [ "$TIER" != "free" ]; then
            echo "::error::Expected tier=free for unlinked repo, got '$TIER'"
            exit 1
          fi
          if [ "$CAP" != "30" ]; then
            echo "::error::Expected cap=30 for free tier, got '$CAP'"
            exit 1
          fi
          echo "::notice::✓ OIDC happy path: tier=$TIER cap=$CAP remaining=$REMAINING"

  # ---------------------------------------------------------------------------
  # NEGATIVE — token with wrong audience must be rejected with code "audience"
  # ---------------------------------------------------------------------------
  negative-audience:
    name: Negative (wrong audience → 401)
    runs-on: ubuntu-latest
    steps:
      - name: Fetch OIDC token with deliberately wrong audience
        id: fetch
        shell: bash
        run: |
          set -euo pipefail
          OIDC_RESPONSE=$(curl -sS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=NOT-THE-RIGHT-AUDIENCE")
          TOKEN=$(echo "$OIDC_RESPONSE" | jq -r '.value // empty')
          if [ -z "$TOKEN" ]; then
            echo "::error::Could not fetch OIDC token (response: $(echo "$OIDC_RESPONSE" | head -c 200))"
            exit 1
          fi
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: POST to /api/scan with wrong-audience token — expect 401 audience
        shell: bash
        env:
          BAD_TOKEN: ${{ steps.fetch.outputs.token }}
        run: |
          set -euo pipefail
          HTTP_STATUS=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST "https://cipherwake.io/api/scan?domain=cipherwake.io" \
            -H "Authorization: Bearer ${BAD_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP $HTTP_STATUS"
          cat /tmp/resp.json
          if [ "$HTTP_STATUS" != "401" ]; then
            echo "::error::Expected 401 from wrong-audience token, got $HTTP_STATUS"
            exit 1
          fi
          OIDC_CODE=$(jq -r '.oidc_error_code // empty' /tmp/resp.json)
          if [ "$OIDC_CODE" != "audience" ]; then
            echo "::error::Expected oidc_error_code=audience, got '$OIDC_CODE'"
            exit 1
          fi
          echo "::notice::Wrong-audience token correctly rejected with oidc_error_code=audience ✓"

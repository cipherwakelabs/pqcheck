name: 'pqcheck'
description: 'Quantum-decryption risk gate. Fails the build when the public-surface Decryption Blast Radius score for a domain meets or exceeds a threshold.'
author: 'Cipherwake'
branding:
  icon: 'shield'
  color: 'purple'

inputs:
  mode:
    description: 'Action mode. "scan" (default) — runs full Decryption Blast Radius scan and gates on threshold. "trust-diff" — calls /api/trust-diff and gates on regression severity vs a baseline (CLI v0.11.0+). "preview-diff" — compares a preview deployment URL against a production URL and surfaces new third-party scripts, header regressions, score drops (Action v3.3+).'
    required: false
    default: 'scan'
  preview-url:
    description: 'Preview deployment URL to scan (mode=preview-diff only). e.g. the previous step's preview_url output'
    required: false
    default: ''
  production-url:
    description: 'Production canonical URL to compare against (mode=preview-diff only). e.g. https://example.com'
    required: false
    default: ''
  compare-transport:
    description: 'When true, transport diffs (TLS/cert/SPKI) contribute to CI verdict. Default false because preview URLs typically use edge-host TLS (Vercel/Netlify/Cloudflare) and direct comparison is noise. Set true only when both URLs are production-shaped origins you own.'
    required: false
    default: 'false'
  baseline:
    description: 'Trust Diff baseline (mode=trust-diff only). One of: last-week | last-month | last-scan | ISO 8601 timestamp. Default: last-week.'
    required: false
    default: 'last-week'
  fail-on:
    description: 'Trust Diff fail-on severity (mode=trust-diff only). One of: any | low | medium | high | critical. CI exits non-zero when any delta meets or exceeds this severity. Default: high.'
    required: false
    default: 'high'
  output-format:
    description: 'Trust Diff output format (mode=trust-diff only). One of: pretty | json | sarif | github (writes GitHub Actions workflow commands). Default: github.'
    required: false
    default: 'github'
  domain:
    description: 'Domain to scan (e.g. example.com)'
    required: true
  threshold:
    description: 'Fail the step if Decryption Blast Radius score >= this value (0-10).'
    required: false
    default: '7'
  fail-on-unreachable:
    description: 'Treat unreachable domains as failure.'
    required: false
    default: 'true'
  comment-on-pr:
    description: 'When true and the workflow runs on a pull_request event, post a comment on the PR with the scan summary. Requires permissions: pull-requests: write in the workflow.'
    required: false
    default: 'false'
  github-token:
    description: 'Token used to post the PR comment. Defaults to GITHUB_TOKEN. Only used when comment-on-pr=true.'
    required: false
    default: ${{ github.token }}
  generate-sarif:
    description: 'When true, write a SARIF 2.1.0 report to the path specified in sarif-output-path. Pair with github/codeql-action/upload-sarif@v3 to surface findings as alerts in the GitHub Security tab (Code Scanning).'
    required: false
    default: 'false'
  sarif-output-path:
    description: 'Path to write the SARIF file when generate-sarif=true. Workflow can then upload it via the codeql-action/upload-sarif step.'
    required: false
    default: 'pqcheck-results.sarif'
  generate-lockfile:
    description: 'When true, write a cipherwake.lock + cipherwake-report.md to the workflow checkout directory. Useful for committing crypto-posture as a versioned artifact, or for diffing across PRs (use github/upload-artifact@v4 to retain). If a legacy quantapact.lock already exists in the checkout, that filename is preserved on overwrite.'
    required: false
    default: 'false'
  fresh:
    description: 'When true, bypass the server-side smart-cache and force a fresh scan. Useful for verifying a cert/key change you just deployed in the same workflow run. Subject to a 20/hr per-IP cap server-side; if exceeded, the server silently downgrades to a cached scan and the step still succeeds.'
    required: false
    default: 'false'
  supply-chain-baseline:
    description: 'Path to a committed third-party baseline JSON (default `.pqcheck-baseline.json`). When set, the action also runs `pqcheck deps <domain> --baseline <path>` and fails the build (exit 4) if any new third-party host appears since baseline. The Polyfill.io-style supply-chain change detector. To accept new additions deliberately, commit an updated baseline (run with `supply-chain-write-baseline: true` once locally to generate it).'
    required: false
    default: ''
  supply-chain-write-baseline:
    description: 'When true (and supply-chain-baseline is set), overwrite the baseline file with the current scan. Used to capture the initial state OR deliberately accept new third-party hosts. Typically used locally / on an admin workflow, not on every PR.'
    required: false
    default: 'false'
  supply-chain-fail-on-new:
    description: 'When true (and supply-chain-baseline is set), fail the build if any new third-party host appeared since the baseline. Defaults to true — the whole point of the baseline is to gate PRs that introduce new third-party scripts.'
    required: false
    default: 'true'
  api-key:
    description: 'Optional Cipherwake API key (qpk_<hex>). When set, the action authenticates with this key and uses your tier-based monthly quota (1K/10K/50K depending on Starter/Growth/Scale) instead of the per-IP rate limit. NEW in v3.2: API key is now OPTIONAL — if your workflow declares `permissions: id-token write`, the action fetches a signed GitHub OIDC token and uses it for per-repo metering (Free=100 calls/repo/mo, paid tiers same as api-key after linking the repo at cipherwake.io/account). Pass via secret: api-key set to `secrets.CIPHERWAKE_API_KEY` (or the legacy `secrets.QUANTAPACT_API_KEY` if you set it up under the old name — both names work forever).'
    required: false
    default: ''

outputs:
  score:
    description: 'Decryption Blast Radius score (0-10)'
    value: ${{ steps.scan.outputs.score }}
  grade:
    description: 'Letter grade A-F'
    value: ${{ steps.scan.outputs.grade }}
  report-url:
    description: 'Shareable report URL on cipherwake.io'
    value: ${{ steps.scan.outputs.report-url }}
  markdown-summary:
    description: 'Full markdown summary suitable for embedding in PR comments / issues'
    value: ${{ steps.scan.outputs.markdown-summary }}

runs:
  using: 'composite'
  steps:
    # R66 (Q3.8 fix): reject unknown `mode` values up front so a typo doesn't
    # silently no-op every subsequent step. Without this guard, `mode: prview-difff`
    # passes through (every step's if-guard evaluates false) and the workflow
    # exits 0 with no output — exactly the kind of "looks like it ran but
    # didn't" failure mode that makes a CI gate untrustworthy.
    - name: Validate mode
      shell: bash
      run: |
        case "${{ inputs.mode }}" in
          scan|trust-diff|preview-diff) ;;
          *) echo "::error::Unknown 'mode' input: '${{ inputs.mode }}'. Valid values: scan | trust-diff | preview-diff."; exit 1 ;;
        esac

    # CLI v0.11.0 (locked 2026-05-16): Trust Diff mode. Calls /api/trust-diff
    # with the configured baseline + fail-on threshold. Exits 2 on fail, 1 on
    # warn, 0 on pass. Skipped entirely when mode != "trust-diff".
    #
    # Habit-loop #9 (locked 2026-05-16): when comment-on-pr=true and the run
    # is a pull_request event, this step also emits a `trust-diff-markdown`
    # output that the "Comment on pull request — Trust Diff" step uses to post
    # a sticky PR comment. Quota cost: one extra Trust Diff API call per PR
    # run when commenting is enabled.
    - name: Trust Diff
      id: trust-diff
      if: inputs.mode == 'trust-diff'
      shell: bash
      env:
        INPUT_DOMAIN: ${{ inputs.domain }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_OUTPUT_FORMAT: ${{ inputs.output-format }}
        INPUT_COMMENT_ON_PR: ${{ inputs.comment-on-pr }}
        INPUT_EVENT_NAME: ${{ github.event_name }}
        CIPHERWAKE_API_KEY: ${{ inputs.api-key }}
        QUANTAPACT_API_KEY: ${{ inputs.api-key }}
      run: |
        set -euo pipefail
        # R52 / R51-B Q8.1 + Q8.3: validate INPUT_DOMAIN before it touches
        # Markdown, URLs, or badge paths. Command substitution + shell
        # quoting already prevent code execution, but a domain containing
        # backticks, brackets, slashes, or newlines can break the PR
        # comment Markdown and the badge URL. Fail loudly with the rejected
        # value so users can fix their workflow rather than ship corrupted
        # comments.
        if ! printf '%s' "$INPUT_DOMAIN" | grep -Eiq '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'; then
          echo "::error::Invalid 'domain' input: '$INPUT_DOMAIN'. Pass a hostname like example.com — no protocol, path, or wildcards."
          exit 1
        fi
        INPUT_DOMAIN="$(printf '%s' "$INPUT_DOMAIN" | tr '[:upper:]' '[:lower:]')"

        # v3.2 OIDC fallback. If no api-key was provided AND the workflow
        # declared `permissions: { id-token: write }`, fetch a GitHub-signed
        # OIDC token and use that as the Bearer. The server distinguishes a
        # JWT (OIDC) from an API key (qpk_) by shape and meters per-repo
        # vs per-account accordingly.
        #
        # ACTIONS_ID_TOKEN_REQUEST_URL + ACTIONS_ID_TOKEN_REQUEST_TOKEN are
        # set by GitHub Actions runtime when id-token: write is granted.
        # Audience `cipherwake-action-v1` MUST match lib/githubOidc.ts's
        # ACCEPTED_AUDIENCES — roll both together when bumping.
        # R48 (post-R47 review MAJOR #5): jq presence check + JWT-shape
        # validation + secret unset. Hardens the OIDC fetch against
        # self-hosted-runner edge cases and reduces token exposure.
        if [ -z "${CIPHERWAKE_API_KEY}" ]; then
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            if ! command -v jq >/dev/null 2>&1; then
              echo "::error::jq is required to parse the GitHub OIDC token response. github-hosted ubuntu-latest runners ship jq by default; self-hosted runners may not. Install jq on this runner OR provide an explicit api-key input via the 'with: api-key:' input + a secret named CIPHERWAKE_API_KEY."
              exit 1
            fi
            echo "::notice::No api-key provided. Fetching GitHub OIDC token for per-repo metering (Free: 100 calls/repo/mo)."
            OIDC_RESPONSE=$(curl -sS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=cipherwake-action-v1")
            # Reduce exposure of the request token after consumption. GitHub
            # masks secrets in logs, but defense-in-depth — a misbehaving
            # tool later in the workflow can't leak what isn't there.
            unset ACTIONS_ID_TOKEN_REQUEST_TOKEN
            CIPHERWAKE_API_KEY=$(echo "$OIDC_RESPONSE" | jq -r '.value // empty')
            if [ -z "${CIPHERWAKE_API_KEY}" ]; then
              echo "::error::OIDC token fetch failed. Response: $(echo "$OIDC_RESPONSE" | head -c 200)"
              exit 1
            fi
            # Sanity-check the fetched value is JWT-shaped (three dot-
            # separated segments). If GitHub returned an HTML error page
            # or unexpected JSON shape, we'd otherwise pass garbage to
            # the CLI and get an opaque 401 from the server. Fail loudly
            # here with the actual content instead.
            case "$CIPHERWAKE_API_KEY" in
              *.*.*) ;;
              *)
                echo "::error::GitHub OIDC response did not contain a JWT. Got: $(echo "$CIPHERWAKE_API_KEY" | head -c 200)"
                exit 1
                ;;
            esac
            export CIPHERWAKE_API_KEY
          else
            echo "::error::Trust Diff needs auth. Either provide api-key (https://cipherwake.io/account#api-keys, Free=100/mo) OR add 'permissions: { id-token: write }' to your workflow so the action can use GitHub OIDC (Free=100/repo/mo, zero setup)."
            exit 1
          fi
        fi
        echo "Cipherwake Trust Diff: domain=$INPUT_DOMAIN baseline=$INPUT_BASELINE fail-on=$INPUT_FAIL_ON"
        # CLI handles the actual /api/trust-diff call, output formatting, and
        # exit code (0 pass, 1 warn, 2 fail). The Action exits with the CLI's
        # exit code automatically since `set -e` is on.
        set +e
        npx -y pqcheck@latest trust-diff "$INPUT_DOMAIN" \
          --baseline "$INPUT_BASELINE" \
          --fail-on "$INPUT_FAIL_ON" \
          --format "$INPUT_OUTPUT_FORMAT"
        EXIT=$?
        set -e

        # Habit-loop #9 — when commenting on PRs is enabled and we're in a
        # pull_request event, run a second time with --format json so we can
        # build the comment markdown from the structured payload. We skip
        # this extra call when not needed to save quota.
        #
        # R40 fix (Q1.4): print a visible note so users know commenting
        # consumes an extra quota call. Previously this lived only in docs.
        if [ "${INPUT_COMMENT_ON_PR}" = "true" ] && [ "${INPUT_EVENT_NAME}" = "pull_request" ]; then
          echo "::notice::Trust Diff comment-on-pr=true consumes one ADDITIONAL Trust Diff API call per PR run (one for log annotations + one for the comment markdown)."
          set +e
          JSON=$(npx -y pqcheck@latest trust-diff "$INPUT_DOMAIN" \
            --baseline "$INPUT_BASELINE" \
            --fail-on "$INPUT_FAIL_ON" \
            --format json 2>/dev/null)
          JSON_EXIT=$?
          set -e
          # R40 fix (Q1.3): require EXIT == 0 AND jq-valid JSON before
          # parsing. The previous `-ge 0` was always true; an exit code of
          # 1/2/3 with partial stdout could cause downstream jq calls to
          # fail under `set -e` and kill the Action before the exit-code
          # translation block ran.
          if [ "$JSON_EXIT" = "0" ] && [ -n "${JSON:-}" ] && jq -e . >/dev/null 2>&1 <<< "$JSON"; then
            VERDICT=$(jq -r '.verdict // "pass"' <<< "$JSON")
            DELTA_COUNT=$(jq -r '.deltas | length' <<< "$JSON")
            QUOTA_USED=$(jq -r '.quota.used_this_month // 0' <<< "$JSON")
            QUOTA_LIMIT=$(jq -r '.quota.monthly_limit // 0' <<< "$JSON")
            # First-run detection (post-R49 ship 2026-05-18): server returns
            # baseline.source = "no_data" when there's no prior scan to diff
            # against. Treat as "baseline captured" rather than as a misleading
            # "no changes" success, which would lie to the user on their first
            # Action invocation. GPT idea #10 — first run should feel valuable.
            BASELINE_SOURCE=$(jq -r '.baseline.source // ""' <<< "$JSON")
            IS_FIRST_RUN=$( [ "$BASELINE_SOURCE" = "no_data" ] && echo "true" || echo "false" )
            VERDICT_EMOJI=$( [ "$VERDICT" = "fail" ] && echo "🔴" || ([ "$VERDICT" = "warn" ] && echo "🟡" || echo "🟢") )
            VERDICT_TEXT=$( [ "$VERDICT" = "fail" ] && echo "Trust regression detected" || ([ "$VERDICT" = "warn" ] && echo "Changes observed below fail-on threshold" || echo "No trust-posture regressions"))

            MD_FILE=$(mktemp)
            {
              # R40 fix (Q1.5): hidden HTML comment marker carries our
              # identity + domain. Sticky-comment search below uses this
              # marker (not the visible heading text) so a user pasting
              # the same heading text into a comment can't cause the
              # Action to PATCH the wrong comment.
              echo "<!-- cipherwake-trust-diff-comment:v1 domain=$INPUT_DOMAIN -->"
              if [ "$IS_FIRST_RUN" = "true" ]; then
                echo "## 🟢 Cipherwake Trust Diff for \`$INPUT_DOMAIN\` — first run"
                echo ""
                echo "**First baseline captured.** Cipherwake recorded the current cert chain, SPKI, security headers, and observed third-party scripts for \`$INPUT_DOMAIN\`. Future PRs and pushes will compare against this snapshot and highlight meaningful changes."
                echo ""
                echo "### What happens next"
                echo ""
                echo "- The next Action run on this repo compares its scan to today's snapshot."
                echo "- If anything regresses (cert change, new vendor script, header removed), this comment will update with the diff."
                echo "- If nothing changes, you'll get a brief \"all clear\" comment with the shareable badge below."
                echo ""
                echo "[View today's snapshot ↗](https://cipherwake.io/r/$INPUT_DOMAIN) · [Configure Trust Diff ↗](https://cipherwake.io/account)"
              else
                echo "## $VERDICT_EMOJI Cipherwake Trust Diff for \`$INPUT_DOMAIN\`"
                echo ""
                echo "**$VERDICT_TEXT** vs baseline \`$INPUT_BASELINE\` (fail-on \`$INPUT_FAIL_ON\`)."
                echo ""
                if [ "$DELTA_COUNT" -gt 0 ]; then
                  echo "### Changed"
                  echo ""
                  # One bullet per delta; severity prefix, then title.
                  jq -r '.deltas[] | "- **[\(.severity | ascii_upcase)]** \(.title // .type)" + (if .what_changed then "\n  " + .what_changed else "" end)' <<< "$JSON"
                  echo ""
                  echo "[Approve vendor / view scan ↗](https://cipherwake.io/r/$INPUT_DOMAIN) · [Configure Trust Diff ↗](https://cipherwake.io/account)"
                else
                  echo "### No changes since baseline"
                  echo ""
                  echo "Certificate, SPKI, HSTS, CSP, DMARC, and vendor scripts all match \`$INPUT_BASELINE\`."
                fi
                # Shareable badge on clean passes (GPT idea #14). Renders the
                # live grade badge for the domain via the public /badge endpoint
                # so teams can paste it into release notes or status pages.
                if [ "$VERDICT" = "pass" ] && [ "$DELTA_COUNT" = "0" ]; then
                  echo ""
                  echo "### Share"
                  echo ""
                  echo "Paste into release notes or your status page:"
                  echo ""
                  echo "\`\`\`markdown"
                  echo "[![Cipherwake Trust Diff](https://cipherwake.io/badge/$INPUT_DOMAIN.svg)](https://cipherwake.io/r/$INPUT_DOMAIN)"
                  echo "\`\`\`"
                fi
              fi
              echo ""
              echo "<sub>Quota: $QUOTA_USED / $QUOTA_LIMIT Trust Diff calls used this month. Posted by [cipherwakelabs/pqcheck@v3](https://github.com/cipherwakelabs/pqcheck/tree/main/action) · [Methodology ↗](https://cipherwake.io/methodology)</sub>"
            } > "$MD_FILE"

            # R40 fix (Q1.8): harden delimiter generation. Previously
            # `uuidgen || openssl rand -hex 8` could degrade to bare "EOF_"
            # on minimal runners. Node crypto is always available (we're
            # invoking npx anyway) — use it as the last-resort fallback.
            EOF_DELIM="EOF_$(uuidgen 2>/dev/null || openssl rand -hex 8 2>/dev/null || node -e 'process.stdout.write(require("crypto").randomBytes(16).toString("hex"))' 2>/dev/null || echo "${RANDOM}_${RANDOM}_$(date +%s)_$$")"
            {
              echo "trust-diff-markdown<<$EOF_DELIM"
              cat "$MD_FILE"
              echo "$EOF_DELIM"
            } >> "$GITHUB_OUTPUT"

            # Mirror to GITHUB_STEP_SUMMARY so the workflow summary page also shows it.
            cat "$MD_FILE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Trust Diff PR comment skipped: JSON output unavailable or invalid (json_exit=$JSON_EXIT)."
          fi
        fi

        # R37 FIX 4/5 (2026-05-16): translate CLI exit codes to Action exit
        # codes. CLI uses 0=pass / 1=warn / 2=fail / 3=error. CI failure
        # semantics: warn must NOT fail the build (the CLI message says "CI
        # not blocked"), only fail and error should. Without this translation
        # the bash `exit $EXIT` would block CI on warn — bug in v3.0.0 draft.
        if [ "$EXIT" = "2" ]; then
          echo "::error::Trust Diff: regression detected at or above fail-on=$INPUT_FAIL_ON. CI blocked."
          exit 2
        elif [ "$EXIT" = "1" ]; then
          echo "::warning::Trust Diff: changes observed below fail-on threshold. CI not blocked."
          exit 0
        fi
        exit "$EXIT"

    # Habit-loop #9 — sticky PR comment for Trust Diff mode.
    - name: Comment on pull request (Trust Diff)
      if: |
        always() &&
        inputs.mode == 'trust-diff' &&
        inputs.comment-on-pr == 'true' &&
        github.event_name == 'pull_request' &&
        steps.trust-diff.outputs.trust-diff-markdown != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        INPUT_DOMAIN: ${{ inputs.domain }}
        SUMMARY: ${{ steps.trust-diff.outputs.trust-diff-markdown }}
      run: |
        set -euo pipefail
        # R52 / R51-B Q8.1: validate INPUT_DOMAIN before it appears in the
        # dedup marker. Markdown / URL safety is also relevant since the
        # Trust Diff step's $SUMMARY may already have used $INPUT_DOMAIN.
        if ! printf '%s' "$INPUT_DOMAIN" | grep -Eiq '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'; then
          echo "::warning::Skipping Cipherwake PR comment: invalid 'domain' input: '$INPUT_DOMAIN'."
          exit 0
        fi
        INPUT_DOMAIN="$(printf '%s' "$INPUT_DOMAIN" | tr '[:upper:]' '[:lower:]')"
        # R40 fix (Q1.5): sticky-comment dedup uses a hidden HTML marker
        # bound to (action+version+domain), NOT the visible heading text.
        # A user pasting "Cipherwake Trust Diff for ..." into a comment
        # can no longer trick the Action into PATCHing their comment.
        MARKER="cipherwake-trust-diff-comment:v1 domain=$INPUT_DOMAIN"

        # List PR comments; find first with our marker in the body.
        # R40 fix (Q1.6): switch from `curl -s ... > /dev/null` to
        # explicit HTTP code capture so GitHub-side failures
        # (403/404/422/5xx) surface as ::warning:: instead of silent
        # success. We use warning (not error) so a comment-post failure
        # does NOT mask the underlying Trust Diff verdict — scan result
        # is the source of truth; the comment is best-effort UX.
        LIST_BODY=$(mktemp)
        LIST_CODE=$(curl -sS -w "%{http_code}" -o "$LIST_BODY" \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments?per_page=100")
        if [ "$LIST_CODE" -lt 200 ] || [ "$LIST_CODE" -ge 300 ]; then
          echo "::warning::Cipherwake PR comment list failed with HTTP $LIST_CODE. Check workflow permissions: pull-requests: write."
          head -c 500 "$LIST_BODY"; echo ""
          exit 0
        fi
        EXISTING_ID=$(jq -r --arg m "$MARKER" '[.[] | select(.body | contains($m))] | .[0].id // empty' < "$LIST_BODY")

        # R40 fix (Q1.2): defense-in-depth — strip raw HTML tags and image
        # markdown from the comment body before posting. GitHub sanitizes
        # rendered output, but a compromised server template could try to
        # plant beaconing img tags or rendered links.
        #
        # The hidden marker `<!-- cipherwake-... -->` lives on line 1 by
        # construction (see Trust Diff step). We preserve line 1 verbatim
        # so the dedup token survives, then strip HTML/image syntax from
        # the body content (line 2+).
        SUMMARY_HEAD=$(printf '%s' "$SUMMARY" | head -n 1)
        SUMMARY_REST=$(printf '%s' "$SUMMARY" | tail -n +2 \
          | sed -E 's/!\[[^]]*\]\([^)]*\)//g' \
          | sed -E 's/<[^>]+>//g')
        SAFE_SUMMARY="${SUMMARY_HEAD}"$'\n'"${SUMMARY_REST}"
        BODY=$(jq -n --arg b "$SAFE_SUMMARY" '{body: $b}')
        WRITE_BODY=$(mktemp)

        if [ -n "$EXISTING_ID" ] && [ "$EXISTING_ID" != "null" ]; then
          HTTP_CODE=$(curl -sS -w "%{http_code}" -o "$WRITE_BODY" \
            -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues/comments/$EXISTING_ID" \
            -d "$BODY")
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Updated existing Cipherwake Trust Diff PR comment ($EXISTING_ID)."
          else
            echo "::warning::Cipherwake PR comment PATCH failed with HTTP $HTTP_CODE on comment $EXISTING_ID."
            head -c 500 "$WRITE_BODY"; echo ""
          fi
        else
          HTTP_CODE=$(curl -sS -w "%{http_code}" -o "$WRITE_BODY" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" \
            -d "$BODY")
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Posted new Cipherwake Trust Diff PR comment on PR #$PR_NUMBER."
          else
            echo "::warning::Cipherwake PR comment POST failed with HTTP $HTTP_CODE. Check workflow permissions: pull-requests: write."
            head -c 500 "$WRITE_BODY"; echo ""
          fi
        fi

    # ========================================================================
    # Preview Deploy Trust Diff (mode=preview-diff)
    # ========================================================================
    # V1 (Action v3.3, locked 2026-05-19): compares two URLs in one call —
    # preview-url (PR deployment) vs production-url (canonical site).
    # Surfaces new third-party scripts + header regressions + score drops
    # inside the PR review loop.
    #
    # Free tier: 100/repo/mo, report-only (no CI fail).
    # Starter+: CI fail rules unlock via `fail-on` input (server downgrades
    #           silently on free tier and notes the upgrade hook in the comment).
    #
    # Auth: same OIDC chain as trust-diff. No API key required for Free.
    # ========================================================================
    - name: Preview Trust Diff
      id: preview-diff
      if: inputs.mode == 'preview-diff'
      shell: bash
      env:
        INPUT_PREVIEW_URL: ${{ inputs.preview-url }}
        INPUT_PRODUCTION_URL: ${{ inputs.production-url }}
        INPUT_COMPARE_TRANSPORT: ${{ inputs.compare-transport }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_COMMENT_ON_PR: ${{ inputs.comment-on-pr }}
        INPUT_EVENT_NAME: ${{ github.event_name }}
        CIPHERWAKE_API_KEY: ${{ inputs.api-key }}
      run: |
        set -euo pipefail
        if [ -z "$INPUT_PREVIEW_URL" ] || [ -z "$INPUT_PRODUCTION_URL" ]; then
          echo "::error::preview-diff mode requires both 'preview-url' and 'production-url' inputs."
          exit 1
        fi
        # R66 (Q3.1 fix): URL validation via Node's WHATWG parser instead of
        # a brittle metachar denylist. The denylist rejected legitimate query
        # strings containing `&`. Server-side does the SSRF check anyway
        # (assertResolvesToPublicAddress); the Action's responsibility here
        # is just to ensure the URLs are well-formed http(s) before we
        # serialize them into the API request body.
        if ! node -e '
          for (const v of [process.env.INPUT_PREVIEW_URL, process.env.INPUT_PRODUCTION_URL]) {
            try {
              const u = new URL(v);
              if (u.protocol !== "https:" && u.protocol !== "http:") {
                console.error("::error::URL must use http(s) scheme: " + v); process.exit(1);
              }
            } catch (e) {
              console.error("::error::URL is not parseable: " + v); process.exit(1);
            }
          }
        '; then
          exit 1
        fi

        # OIDC fallback (same shape as Trust Diff step).
        if [ -z "${CIPHERWAKE_API_KEY}" ]; then
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            if ! command -v jq >/dev/null 2>&1; then
              echo "::error::jq is required to parse the GitHub OIDC token. Install it on this runner or pass an explicit api-key."; exit 1
            fi
            echo "::notice::Preview Diff: fetching GitHub OIDC token (Free: 100 calls/repo/mo)."
            OIDC_RESPONSE=$(curl -sS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=cipherwake-action-v1")
            unset ACTIONS_ID_TOKEN_REQUEST_TOKEN
            CIPHERWAKE_API_KEY=$(echo "$OIDC_RESPONSE" | jq -r '.value // empty')
            if [ -z "${CIPHERWAKE_API_KEY}" ]; then
              echo "::error::OIDC token fetch failed."; head -c 200 <<<"$OIDC_RESPONSE"; exit 1
            fi
            case "$CIPHERWAKE_API_KEY" in *.*.*) ;; *)
              echo "::error::OIDC response was not a JWT."; exit 1 ;;
            esac
            export CIPHERWAKE_API_KEY
          else
            echo "::error::Preview Diff needs auth. Add 'permissions: { id-token: write }' to the workflow, or pass an api-key."
            exit 1
          fi
        fi

        # R66 (B4 fix): policy_mode mirrors the user's intent.
        # `fail-on: none` (case-insensitive) → report-only; any other value
        # → fail mode (server downgrades for Free tier and notes it in the
        # response via downgraded_from_fail). Default `fail-on: high` means
        # paid users get CI gating out of the box.
        POLICY_MODE="fail"
        case "$(printf '%s' "$INPUT_FAIL_ON" | tr '[:upper:]' '[:lower:]')" in
          none|off|"") POLICY_MODE="report" ;;
        esac

        echo "Cipherwake Preview Diff: preview=$INPUT_PREVIEW_URL production=$INPUT_PRODUCTION_URL policy=$POLICY_MODE fail-on=$INPUT_FAIL_ON"
        RESP=$(mktemp)
        HTTP=$(curl -sS -w "%{http_code}" -o "$RESP" \
          -X POST "https://cipherwake.io/api/preview-diff" \
          -H "Authorization: Bearer ${CIPHERWAKE_API_KEY}" \
          -H "Content-Type: application/json" \
          --data "$(jq -n \
            --arg p "$INPUT_PREVIEW_URL" \
            --arg q "$INPUT_PRODUCTION_URL" \
            --arg fo "$INPUT_FAIL_ON" \
            --arg pm "$POLICY_MODE" \
            --argjson ct "$INPUT_COMPARE_TRANSPORT" \
            '{preview_url:$p, production_url:$q, fail_on:$fo, compare_transport:$ct, policy_mode:$pm}')")
        if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
          echo "::error::Preview Diff API returned HTTP $HTTP"
          head -c 1000 "$RESP"; echo ""
          exit 1
        fi

        # Surface the diff as a workflow summary + step output for the PR
        # comment step below. We do NOT exit non-zero on Free tier (server
        # downgrades policy_mode to report); paid tiers can opt into fail.
        VERDICT=$(jq -r '.result.verdict' < "$RESP")
        MAX_SEV=$(jq -r '.result.max_severity' < "$RESP")
        SUMMARY_LINES=$(jq -r '.result.summary_lines[]' < "$RESP")
        DOWNGRADED=$(jq -r '.downgraded_from_fail' < "$RESP")
        PREVIEW_SCORE=$(jq -r '.preview.score // "—"' < "$RESP")
        PROD_SCORE=$(jq -r '.production.score // "—"' < "$RESP")

        {
          echo "## 🔬 Cipherwake Preview Trust Diff"
          echo ""
          echo "**Preview:** \`$INPUT_PREVIEW_URL\` (DBR: $PREVIEW_SCORE)"
          echo "**Production:** \`$INPUT_PRODUCTION_URL\` (DBR: $PROD_SCORE)"
          echo ""
          echo "**Verdict:** $VERDICT (max severity: $MAX_SEV)"
          echo ""
          echo "**Application surface changes:**"
          echo "$SUMMARY_LINES" | sed 's/^/- /'
        } >> "$GITHUB_STEP_SUMMARY"

        # Build a hidden-marker comment block for the PR comment step.
        # R66 (B3 fix): construct the jq program with --arg, NOT shell
        # concatenation. The previous form interpolated $INPUT_PREVIEW_URL
        # into the jq program string, which would break (or worse, inject)
        # on URLs containing single quotes or backslashes. --arg passes the
        # value as a jq variable, escaped by jq's own JSON encoder.
        MARKER="cipherwake-preview-diff-comment:v1 preview=$(printf '%s' "$INPUT_PREVIEW_URL" | sha256sum | cut -c1-12)"
        COMMENT_BODY=$(jq -r \
          --arg marker "$MARKER" \
          --arg preview "$INPUT_PREVIEW_URL" \
          --arg production "$INPUT_PRODUCTION_URL" \
          '
            .result |
            "<!-- \($marker) -->\n" +
            "### 🔬 Cipherwake Preview Trust Diff\n\n" +
            "**Preview:** `\($preview)`\n" +
            "**Production:** `\($production)`\n\n" +
            "**Verdict:** \(.verdict) (max severity: \(.max_severity))\n\n" +
            "**Application surface:**\n" +
            (.summary_lines | map("- " + .) | join("\n"))
          ' < "$RESP")
        {
          echo "preview-diff-markdown<<EOF_MD"
          echo "$COMMENT_BODY"
          echo "EOF_MD"
        } >> "$GITHUB_OUTPUT"

        if [ "$DOWNGRADED" = "true" ]; then
          echo "::notice::Free tier is report-only. Starter (\$29/mo) unlocks CI fail rules + approved-vendor allowlist."
        fi

        # R66 (B4 fix): exit code now mirrors the server's verdict.
        # - verdict=fail (paid tier with policy_mode=fail + max_severity >= fail_on)
        #   → exit 2 (CI block)
        # - verdict=warn (paid tier with regression below threshold, OR free
        #   tier with any regression) → exit 1 emitted as ::warning::, but
        #   CI is not blocked (exit 0 to keep PR comment visible)
        # - verdict=pass → exit 0
        case "$VERDICT" in
          fail)
            echo "::error::Preview Trust Diff: regression at or above fail-on=$INPUT_FAIL_ON. CI blocked."
            exit 2
            ;;
          warn)
            echo "::warning::Preview Trust Diff: changes observed below fail-on threshold. CI not blocked."
            exit 0
            ;;
          *)
            exit 0
            ;;
        esac

    # Sticky PR comment for Preview Diff.
    - name: Comment on pull request (Preview Diff)
      if: |
        always() &&
        inputs.mode == 'preview-diff' &&
        inputs.comment-on-pr == 'true' &&
        github.event_name == 'pull_request' &&
        steps.preview-diff.outputs.preview-diff-markdown != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        SUMMARY: ${{ steps.preview-diff.outputs.preview-diff-markdown }}
        INPUT_PREVIEW_URL: ${{ inputs.preview-url }}
      run: |
        set -euo pipefail
        MARKER="cipherwake-preview-diff-comment:v1 preview=$(printf '%s' "$INPUT_PREVIEW_URL" | sha256sum | cut -c1-12)"
        LIST_BODY=$(mktemp)
        LIST_CODE=$(curl -sS -w "%{http_code}" -o "$LIST_BODY" \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments?per_page=100")
        if [ "$LIST_CODE" -lt 200 ] || [ "$LIST_CODE" -ge 300 ]; then
          echo "::warning::Cipherwake Preview Diff PR comment list failed with HTTP $LIST_CODE."
          head -c 500 "$LIST_BODY"; echo ""
          exit 0
        fi
        EXISTING_ID=$(jq -r --arg m "$MARKER" '[.[] | select(.body | contains($m))] | .[0].id // empty' < "$LIST_BODY")
        # Defense-in-depth: strip image markdown + raw HTML from line 2+
        SUMMARY_HEAD=$(printf '%s' "$SUMMARY" | head -n 1)
        SUMMARY_REST=$(printf '%s' "$SUMMARY" | tail -n +2 \
          | sed -E 's/!\[[^]]*\]\([^)]*\)//g' \
          | sed -E 's/<[^>]+>//g')
        SAFE_SUMMARY="${SUMMARY_HEAD}"$'\n'"${SUMMARY_REST}"
        BODY=$(jq -n --arg b "$SAFE_SUMMARY" '{body: $b}')
        WRITE_BODY=$(mktemp)
        if [ -n "$EXISTING_ID" ] && [ "$EXISTING_ID" != "null" ]; then
          HTTP_CODE=$(curl -sS -w "%{http_code}" -o "$WRITE_BODY" \
            -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues/comments/$EXISTING_ID" \
            -d "$BODY")
        else
          HTTP_CODE=$(curl -sS -w "%{http_code}" -o "$WRITE_BODY" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" \
            -d "$BODY")
        fi
        if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
          echo "Preview Diff PR comment posted/updated."
        else
          echo "::warning::Preview Diff PR comment write failed with HTTP $HTTP_CODE."
          head -c 500 "$WRITE_BODY"; echo ""
        fi

    - id: scan
      if: inputs.mode != 'trust-diff' && inputs.mode != 'preview-diff'
      shell: bash
      env:
        INPUT_DOMAIN: ${{ inputs.domain }}
        INPUT_THRESHOLD: ${{ inputs.threshold }}
        INPUT_FAIL_ON_UNREACHABLE: ${{ inputs.fail-on-unreachable }}
        INPUT_FRESH: ${{ inputs.fresh }}
        # Pass api-key through to the CLI subprocess as QUANTAPACT_API_KEY.
        # The CLI reads this env var and sends Authorization: Bearer <key>
        # on every /api/* call, bypassing per-IP rate limits in favor of
        # the account's tier-based monthly quota.
        QUANTAPACT_API_KEY: ${{ inputs.api-key }}
      run: |
        set -euo pipefail
        # R52 / R51-B Q8.1: validate INPUT_DOMAIN before it touches URLs,
        # the Markdown summary, or the CLI subprocess. Same hostname-only
        # regex as the Trust Diff job — keep the two in sync.
        if ! printf '%s' "$INPUT_DOMAIN" | grep -Eiq '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'; then
          echo "::error::Invalid 'domain' input: '$INPUT_DOMAIN'. Pass a hostname like example.com — no protocol, path, or wildcards."
          exit 1
        fi
        INPUT_DOMAIN="$(printf '%s' "$INPUT_DOMAIN" | tr '[:upper:]' '[:lower:]')"

        # First-run onboarding nudge: when no api-key is configured, surface
        # a one-line tip so the operator knows there's a higher-limit path.
        # This is a ::notice:: (info-level) so it never breaks strict workflows
        # but DOES appear in the run log + summary. Only prints when the
        # input is empty — silent once they've wired up the secret.
        if [ -z "${QUANTAPACT_API_KEY:-}" ]; then
          echo "::notice title=pqcheck — free tier limits apply::Add a Cipherwake API key for higher rate limits + private results. Create one free at https://cipherwake.io/signin then pass via the 'api-key' input bound to a secret named CIPHERWAKE_API_KEY in your workflow."
        fi

        # Pass --fresh through to the CLI when the workflow requested it.
        # Useful for "deploy then verify" workflows: change cert in step N,
        # scan in step N+1 with fresh=true to guarantee post-deploy state
        # instead of pre-deploy cache.
        FRESH_FLAG=""
        if [ "$INPUT_FRESH" = "true" ]; then
          FRESH_FLAG="--fresh"
        fi

        REPORT=$(npx -y pqcheck@latest "$INPUT_DOMAIN" --format json $FRESH_FLAG)
        SCORE=$(jq -r '.score // empty' <<< "$REPORT")
        GRADE=$(jq -r '.grade // "—"' <<< "$REPORT")
        LABEL=$(jq -r '.scoreLabel // "—"' <<< "$REPORT")
        REACHABLE=$(jq -r '.reachable' <<< "$REPORT")
        REPORT_URL="https://cipherwake.io/r/$INPUT_DOMAIN"

        # Build a markdown summary that we'll attach to outputs (for PR comments)
        # and write to GITHUB_STEP_SUMMARY (for the run page).
        MD_FILE=$(mktemp)
        {
          echo "## 🔐 Cipherwake — Decryption Blast Radius scan"
          echo ""
          if [ "$REACHABLE" != "true" ]; then
            echo "**\`$INPUT_DOMAIN\`** — unreachable"
          else
            echo "| Domain | Score | Grade | Threshold |"
            echo "|---|---|---|---|"
            echo "| \`$INPUT_DOMAIN\` | **$SCORE / 10** ($LABEL) | $GRADE | $INPUT_THRESHOLD |"
            echo ""

            # Recent attack-surface changes — pulled from the public
            # /api/changes-summary endpoint. Adds a one-line "N changes since
            # last scan" signal to the PR comment so dev teams notice when
            # their public posture drifts between PRs. Fail-soft: if the
            # endpoint is unreachable, we just skip this section.
            CHANGES_JSON=$(curl -sS --max-time 8 "https://cipherwake.io/api/changes-summary?domain=$INPUT_DOMAIN" 2>/dev/null || echo '{}')
            CHANGE_COUNT=$(jq -r '.changes.last14d // 0' <<< "$CHANGES_JSON" 2>/dev/null || echo "0")
            TRACKED_SINCE=$(jq -r '.trackedSince // empty' <<< "$CHANGES_JSON" 2>/dev/null || echo "")
            OBSERVATIONS=$(jq -r '.observations // 0' <<< "$CHANGES_JSON" 2>/dev/null || echo "0")

            # Provenance pill — proves this isn't a one-shot probe. Renders
            # as a small italic footnote under the score table when we
            # actually have prior observations for the domain.
            if [ -n "$TRACKED_SINCE" ]; then
              TRACKED_DATE=$(echo "$TRACKED_SINCE" | cut -c1-10)
              if [ "$OBSERVATIONS" -gt 0 ] 2>/dev/null; then
                echo "_Tracked by Cipherwake since \`$TRACKED_DATE\` · $OBSERVATIONS observations._"
              else
                echo "_Tracked by Cipherwake since \`$TRACKED_DATE\`._"
              fi
              echo ""
            fi

            if [ -n "$TRACKED_SINCE" ] && [ "$CHANGE_COUNT" -gt 0 ] 2>/dev/null; then
              NEW_SUBS=$(jq -r '.breakdown.newSubdomains14d // 0' <<< "$CHANGES_JSON")
              NEW_SCRIPTS=$(jq -r '.breakdown.newScripts14d // 0' <<< "$CHANGES_JSON")
              BREAKDOWN_PARTS=""
              [ "$NEW_SUBS" -gt 0 ] 2>/dev/null && BREAKDOWN_PARTS="$BREAKDOWN_PARTS $NEW_SUBS new subdomain(s);"
              [ "$NEW_SCRIPTS" -gt 0 ] 2>/dev/null && BREAKDOWN_PARTS="$BREAKDOWN_PARTS $NEW_SCRIPTS new third-party script(s);"
              echo "⚠️ **$CHANGE_COUNT public attack-surface change(s)** detected on \`$INPUT_DOMAIN\` in the last 14 days.${BREAKDOWN_PARTS} [See changelog →](https://cipherwake.io/domain/$INPUT_DOMAIN/security-changelog)"
              echo ""
            elif [ -n "$TRACKED_SINCE" ]; then
              echo "✓ No public attack-surface changes detected on \`$INPUT_DOMAIN\` in the last 14 days. [Changelog →](https://cipherwake.io/domain/$INPUT_DOMAIN/security-changelog)"
              echo ""
            fi

            echo "**Top findings:**"
            echo ""
            jq -r '.findings // [] | .[0:8][] | "- **[\(.severity | ascii_upcase)]** \(.title)\n  \(.detail)"' <<< "$REPORT"
            echo ""
            echo "[Full report ↗]($REPORT_URL) · [Methodology ↗](https://cipherwake.io/methodology)"
            echo ""
            # Conversion CTA per generalbusiness.md principle #15: every
            # value-delivery moment surfaces the same /watch/<domain> path.
            # Visible in the PR comment (where developers actually read,
            # vs the ::notice:: log which most ignore).
            echo "📌 **Watch \`$INPUT_DOMAIN\` for changes (free):** [cipherwake.io/watch/$INPUT_DOMAIN](https://cipherwake.io/watch/$INPUT_DOMAIN) — weekly email when cert / scripts / TLS posture drift."
          fi
          echo ""
          echo "<sub>Posted by [pqcheck-action](https://github.com/cipherwakelabs/pqcheck/tree/main/action) · Public surface only — internal Blast Radius is typically 12-40× this score.</sub>"
        } > "$MD_FILE"

        # Make the markdown available as a step output (GH Actions multi-line syntax)
        EOF_DELIM="EOF_$(uuidgen 2>/dev/null || openssl rand -hex 8)"
        {
          echo "score=$SCORE"
          echo "grade=$GRADE"
          echo "report-url=$REPORT_URL"
          echo "markdown-summary<<$EOF_DELIM"
          cat "$MD_FILE"
          echo "$EOF_DELIM"
        } >> "$GITHUB_OUTPUT"

        # Mirror to GITHUB_STEP_SUMMARY so the run page also shows it.
        cat "$MD_FILE" >> "$GITHUB_STEP_SUMMARY"

        if [ "$REACHABLE" != "true" ]; then
          if [ "$INPUT_FAIL_ON_UNREACHABLE" = "true" ]; then
            echo "::error::Domain $INPUT_DOMAIN unreachable; failing per fail-on-unreachable=true"
            exit 1
          fi
          exit 0
        fi

        if awk -v s="$SCORE" -v t="$INPUT_THRESHOLD" 'BEGIN { exit !(s+0 >= t+0) }'; then
          echo "::error::Decryption Blast Radius score $SCORE met or exceeded threshold $INPUT_THRESHOLD for $INPUT_DOMAIN"
          exit 2
        fi

    - name: Comment on pull request
      if: |
        always() &&
        inputs.comment-on-pr == 'true' &&
        github.event_name == 'pull_request' &&
        steps.scan.outputs.markdown-summary != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        SUMMARY: ${{ steps.scan.outputs.markdown-summary }}
      run: |
        set -euo pipefail
        # Sticky comment: replace any prior pqcheck comment on this PR rather than spam.
        EXISTING_ID=$(curl -s \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" \
          | jq -r '[.[] | select(.body | test("Cipherwake — Decryption Blast Radius scan"))] | .[0].id // empty')

        BODY=$(jq -n --arg b "$SUMMARY" '{body: $b}')

        if [ -n "$EXISTING_ID" ] && [ "$EXISTING_ID" != "null" ]; then
          curl -s -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues/comments/$EXISTING_ID" \
            -d "$BODY" > /dev/null
          echo "Updated existing pqcheck PR comment ($EXISTING_ID)."
        else
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" \
            -d "$BODY" > /dev/null
          echo "Posted new pqcheck PR comment on PR #$PR_NUMBER."
        fi

    - name: Generate SARIF report
      if: inputs.mode != 'trust-diff' && inputs.mode != 'preview-diff' && inputs.generate-sarif == 'true'
      shell: bash
      env:
        INPUT_DOMAIN: ${{ inputs.domain }}
        SARIF_PATH: ${{ inputs.sarif-output-path }}
        INPUT_FRESH: ${{ inputs.fresh }}
        QUANTAPACT_API_KEY: ${{ inputs.api-key }}
      run: |
        set -euo pipefail
        FRESH_FLAG=""
        if [ "$INPUT_FRESH" = "true" ]; then
          FRESH_FLAG="--fresh"
        fi
        echo "Generating SARIF for $INPUT_DOMAIN -> $SARIF_PATH"
        npx -y pqcheck@latest "$INPUT_DOMAIN" --format sarif $FRESH_FLAG > "$SARIF_PATH"
        echo "SARIF written. Pair with: github/codeql-action/upload-sarif@v3"
        echo "  with sarif_file: $SARIF_PATH"

    - name: Generate cipherwake.lock
      if: inputs.mode != 'trust-diff' && inputs.mode != 'preview-diff' && inputs.generate-lockfile == 'true'
      shell: bash
      env:
        INPUT_DOMAIN: ${{ inputs.domain }}
        CIPHERWAKE_API_KEY: ${{ inputs.api-key }}
        QUANTAPACT_API_KEY: ${{ inputs.api-key }}
      run: |
        set -euo pipefail
        npx -y pqcheck@latest lock "$INPUT_DOMAIN"
        # CLI auto-detects existing quantapact.lock and preserves that filename;
        # otherwise writes cipherwake.lock + cipherwake-report.md.
        if [ -f cipherwake.lock ]; then
          echo "Wrote cipherwake.lock and cipherwake-report.md to current directory."
        else
          echo "Wrote quantapact.lock and quantapact-report.md (legacy filename preserved)."
        fi
        echo "Use github/upload-artifact@v4 to retain across runs, or commit them to track posture changes in PR diffs."

    - name: Supply-chain change detection
      if: inputs.mode != 'trust-diff' && inputs.mode != 'preview-diff' && inputs.supply-chain-baseline != ''
      shell: bash
      env:
        INPUT_DOMAIN: ${{ inputs.domain }}
        BASELINE: ${{ inputs.supply-chain-baseline }}
        WRITE_BASELINE: ${{ inputs.supply-chain-write-baseline }}
        FAIL_ON_NEW: ${{ inputs.supply-chain-fail-on-new }}
        INPUT_FRESH: ${{ inputs.fresh }}
        QUANTAPACT_API_KEY: ${{ inputs.api-key }}
      run: |
        set -euo pipefail
        # Polyfill.io-style supply-chain change gate. Runs `pqcheck deps` with a
        # baseline file: any third-party host that appeared since the committed
        # baseline triggers a fail (exit 4) so the PR can't merge without an
        # explicit baseline update — supply-chain additions become a reviewable
        # event rather than a silent change.
        FLAGS="--baseline $BASELINE"
        if [ "$WRITE_BASELINE" = "true" ]; then
          FLAGS="$FLAGS --write-baseline"
        fi
        if [ "$FAIL_ON_NEW" = "true" ]; then
          FLAGS="$FLAGS --fail-on-new"
        fi
        if [ "$INPUT_FRESH" = "true" ]; then
          FLAGS="$FLAGS --fresh"
        fi
        echo "Running: npx -y pqcheck@latest deps $INPUT_DOMAIN $FLAGS"
        # Capture exit status without letting `set -e` exit immediately so we
        # can produce a useful annotation on exit 4 (new hosts) vs other errors.
        set +e
        npx -y pqcheck@latest deps "$INPUT_DOMAIN" $FLAGS
        EXIT=$?
        set -e
        if [ "$EXIT" = "4" ]; then
          echo "::error::Supply-chain change detected — new third-party host(s) appeared on $INPUT_DOMAIN since the committed baseline. Audit the additions, then run with supply-chain-write-baseline=true (once) to accept them and re-commit $BASELINE."
          exit 4
        fi
        if [ "$EXIT" != "0" ]; then
          echo "::warning::pqcheck deps exited with status $EXIT (non-zero, non-baseline). Check the action log."
          exit "$EXIT"
        fi
